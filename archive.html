<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Archive | Media Law News</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">

<header class="bg-white border-b">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="index.html" class="text-2xl font-bold text-blue-900">
            Media Law News
        </a>
        <a href="index.html" class="text-blue-600 hover:underline">
            ← Back to Home
        </a>
    </div>
</header>

<section class="max-w-7xl mx-auto px-6 py-10">
    <h1 class="text-4xl font-bold mb-4">News Archive</h1>

    <p class="text-slate-600 mb-8">
        Browse current and archived developments in media law,
        First Amendment law, entertainment law, privacy, defamation,
        digital media, and Supreme Court decisions.
    </p>

    <div class="bg-white rounded-xl shadow-sm border p-6">
        <h2 class="text-xl font-semibold mb-4">
            Latest News Feed
        </h2>

        <div id="archiveNews" class="space-y-4">
            <p>Loading articles...</p>
        </div>
    </div>
</section>

<script>
const RSS_FEEDS = [
  "https://scotusblog.com/feed/",
  "https://firstamendmentwatch.org/feed/",
  "https://www.rcfp.org/feed/",
  "https://www.eff.org/rss/updates.xml"
];

async function loadArchive() {
  const container = document.getElementById("archiveNews");

  try {
    let articles = [];

    for (const feed of RSS_FEEDS) {
      const url =
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(feed);

      const response = await fetch(url);
      const data = await response.json();

      if (data.items) {
        articles.push(...data.items.slice(0, 20));
      }
    }

    articles.sort(
      (a, b) => new Date(b.pubDate) - new Date(a.pubDate)
    );

    container.innerHTML = articles
      .map(
        article => `
        <div class="border-b pb-4">
            <a href="${article.link}"
               target="_blank"
               class="text-blue-700 font-semibold hover:underline">
               ${article.title}
            </a>
            <div class="text-sm text-slate-500 mt-1">
                ${new Date(article.pubDate).toLocaleDateString()}
            </div>
        </div>
      `
      )
      .join("");
  } catch (error) {
    container.innerHTML =
      "<p>Unable to load archive at this time.</p>";
  }
}

loadArchive();
</script>
