<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Archive | Media Law News</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">

<header class="bg-white border-b">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="index.html" class="text-2xl font-bold text-blue-900">
            Media Law News
        </a>
        <a href="index.html" class="text-blue-600 hover:underline">
            ← Back to Home
        </a>
    </div>
</header>

<section class="max-w-7xl mx-auto px-6 py-10">
    <h1 class="text-4xl font-bold mb-4">News Archive</h1>

    <p class="text-slate-600 mb-8">
        Browse current and archived developments in media law,
        First Amendment law, entertainment law, privacy, defamation,
        digital media, and Supreme Court decisions.
    </p>

    <div class="bg-white rounded-xl shadow-sm border p-6">
        <h2 class="text-xl font-semibold mb-4">Latest News Feed</h2>

        <div class="grid gap-3 sm:grid-cols-2 mb-4">
            <div>
                <label for="archiveSearch" class="block text-sm font-medium text-slate-700 mb-1">Search articles</label>
                <input
                    id="archiveSearch"
                    type="search"
                    placeholder="Search by title or content..."
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
            </div>
            <div>
                <label for="categoryFilter" class="block text-sm font-medium text-slate-700 mb-1">Category</label>
                <select
                    id="categoryFilter"
                    class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                    <option value="all">All categories</option>
                    <option value="First Amendment">First Amendment</option>
                    <option value="Media Law">Media Law</option>
                    <option value="Entertainment Law">Entertainment Law</option>
                </select>
            </div>
        </div>

        <div id="archiveNews" class="space-y-4" aria-live="polite">
            <p>Loading articles...</p>
        </div>
    </div>
</section>

<script>
const RSS_FEEDS = [
  "https://www.scotusblog.com/feed/",
  "https://firstamendmentwatch.org/feed/",
  "https://www.rcfp.org/feed/",
  "https://www.eff.org/rss/updates.xml"
];

const CATEGORIES = ["First Amendment", "Media Law", "Entertainment Law"];
const archiveContainer = document.getElementById("archiveNews");
const searchInput = document.getElementById("archiveSearch");
const categoryFilter = document.getElementById("categoryFilter");
let archiveArticles = [];

function getCategory(article) {
  const text = [article.title, article.description, article.content]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

  const firstAmendmentTerms = [
    "first amendment", "free speech", "freedom of speech", "freedom of the press",
    "press freedom", "prior restraint", "public forum", "defamation", "libel",
    "reporter", "journalist", "newsgathering", "shield law"
  ];
  const entertainmentTerms = [
    "entertainment", "hollywood", "film", "movie", "television", "music industry",
    "recording artist", "copyright", "right of publicity", "talent", "streaming",
    "video game", "video games"
  ];

  if (firstAmendmentTerms.some(term => text.includes(term))) {
    return "First Amendment";
  }
  if (entertainmentTerms.some(term => text.includes(term))) {
    return "Entertainment Law";
  }
  return "Media Law";
}

function renderArticle(article) {
  const item = document.createElement("article");
  item.className = "border-b pb-4";

  const titleLink = document.createElement("a");
  titleLink.href = article.link;
  titleLink.target = "_blank";
  titleLink.rel = "noopener noreferrer";
  titleLink.className = "text-blue-700 font-semibold hover:underline";
  titleLink.textContent = article.title || "Untitled article";

  const categoryLabel = document.createElement("span");
  categoryLabel.className = "ml-2 inline-block rounded-full bg-blue-50 px-2 py-1 text-xs font-medium text-blue-800";
  categoryLabel.textContent = article.category;

  const date = document.createElement("div");
  date.className = "text-sm text-slate-500 mt-1";
  const publishedDate = new Date(article.pubDate);
  date.textContent = Number.isNaN(publishedDate.getTime())
    ? ""
    : publishedDate.toLocaleDateString();

  item.append(titleLink, categoryLabel, date);
  return item;
}

function renderArchive() {
  const query = searchInput.value.trim().toLowerCase();
  const selectedCategory = categoryFilter.value;
  const filteredArticles = archiveArticles.filter(article => {
    const searchableText = [article.title, article.description, article.content]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

    return searchableText.includes(query) &&
      (selectedCategory === "all" || article.category === selectedCategory);
  });

  archiveContainer.replaceChildren();

  if (filteredArticles.length === 0) {
    const message = document.createElement("p");
    message.className = "text-slate-600";
    message.textContent = archiveArticles.length
      ? "No articles match your search and category."
      : "No articles are available right now.";
    archiveContainer.append(message);
    return;
  }

  const categoriesToRender = selectedCategory === "all"
    ? CATEGORIES
    : [selectedCategory];

  for (const category of categoriesToRender) {
    const categoryArticles = filteredArticles.filter(article => article.category === category);
    if (categoryArticles.length === 0) continue;

    const section = document.createElement("section");
    section.className = "mb-6";

    const heading = document.createElement("h3");
    heading.className = "text-lg font-semibold text-slate-800 mb-3";
    heading.textContent = category;

    const articleList = document.createElement("div");
    articleList.className = "space-y-4";
    categoryArticles.forEach(article => articleList.append(renderArticle(article)));

    section.append(heading, articleList);
    archiveContainer.append(section);
  }
}

async function loadArchive() {
  try {
    // Feeds are fetched and cached on the server; see /api/feeds.
    const response = await fetch("/api/feeds");
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    const byUrl = new Map((data.feeds || []).map(feed => [feed.url, feed]));

    for (const feedUrl of RSS_FEEDS) {
      const feed = byUrl.get(feedUrl);
      if (feed && feed.items) {
        archiveArticles.push(...feed.items);
      }
    }

    archiveArticles = archiveArticles.map(article => ({
      ...article,
      category: getCategory(article)
    }));
    archiveArticles.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
    renderArchive();
  } catch (error) {
    archiveContainer.textContent = "Unable to load archive at this time.";
  }
}

searchInput.addEventListener("input", renderArchive);
categoryFilter.addEventListener("change", renderArchive);
loadArchive();
</script>

</body>
</html>
