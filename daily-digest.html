<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Law News • Daily Digest</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <main class="max-w-4xl mx-auto px-6 py-12">
        <a href="index.html" class="text-sm font-semibold text-blue-800 hover:underline">← Back to Media Law News</a>

        <header class="mt-8">
            <p class="text-sm font-semibold uppercase tracking-[0.2em] text-blue-700">Media Law News</p>
            <h1 class="mt-2 text-4xl md:text-5xl font-bold tracking-tight">Your Daily Digest</h1>
            <p class="mt-3 text-slate-600 max-w-2xl">
                Build a digest from the same stories shown on the site. This works entirely in the browser and lets you
                download the text or open it in your email app.
            </p>
        </header>

        <section class="mt-8 p-6 bg-white border border-slate-200 rounded-2xl shadow-sm" aria-labelledby="choose-topics">
            <h2 id="choose-topics" class="text-xl font-semibold">Choose topics</h2>
            <div class="mt-4 flex flex-wrap gap-3">
                <label class="flex items-center gap-2 rounded-xl border border-slate-200 px-3 py-2 text-sm">
                    <input type="checkbox" value="first-amendment" checked>
                    <span>First Amendment</span>
                </label>
                <label class="flex items-center gap-2 rounded-xl border border-slate-200 px-3 py-2 text-sm">
                    <input type="checkbox" value="media-law" checked>
                    <span>Media Law</span>
                </label>
                <label class="flex items-center gap-2 rounded-xl border border-slate-200 px-3 py-2 text-sm">
                    <input type="checkbox" value="entertainment" checked>
                    <span>Entertainment Law</span>
                </label>
            </div>

            <div class="mt-6 flex flex-wrap gap-3">
                <button id="refresh-stories" class="px-5 py-3 bg-blue-900 text-white rounded-xl font-semibold hover:bg-blue-800 transition-colors">
                    Refresh stories
                </button>
                <button id="download-digest" class="px-5 py-3 bg-white border border-slate-300 rounded-xl font-semibold hover:bg-slate-50 transition-colors">
                    Download digest (.txt)
                </button>
                <button id="email-digest" class="px-5 py-3 bg-white border border-slate-300 rounded-xl font-semibold hover:bg-slate-50 transition-colors">
                    Open in email app
                </button>
            </div>

            <p id="digest-status" class="mt-4 text-sm text-slate-500" aria-live="polite">Loading stories…</p>
        </section>

        <section class="mt-8">
            <h2 class="text-xl font-semibold">Included stories</h2>
            <div id="digest-stories" class="mt-4 space-y-4"></div>
        </section>
    </main>

    <iframe id="site-frame" src="index.html" class="hidden" title="News feed source"></iframe>

    <script>
        const siteFrame = document.getElementById('site-frame');
        const digestStories = document.getElementById('digest-stories');
        const statusEl = document.getElementById('digest-status');

        let latestStories = [];

        function getSelectedTopics() {
            return [...document.querySelectorAll('input[type="checkbox"]:checked')].map(input => input.value);
        }

        function normalizeCategory(value) {
            const text = (value || '').toLowerCase();
            if (text.includes('first')) return 'First Amendment';
            if (text.includes('media')) return 'Media Law';
            if (text.includes('entertainment')) return 'Entertainment Law';
            return 'News';
        }

        function readStoriesFromSite() {
            try {
                const doc = siteFrame.contentDocument;
                if (!doc) return [];

                return [...doc.querySelectorAll('#news-grid .legal-card')].map(card => {
                    const title = card.querySelector('h3')?.textContent?.trim() || 'Untitled story';
                    const summary = card.querySelector('p')?.textContent?.trim() || '';
                    const categoryEl = card.querySelector('.category-tag');
                    const category = normalizeCategory(categoryEl?.textContent || '');
                    const source = card.querySelector('.border-t > div')?.textContent?.trim() || 'Media Law News';
                    const link = card.querySelector('a[href]')?.href || '';
                    return { title, summary, category, source, link };
                }).filter(item => item.title);
            } catch {
                return [];
            }
        }

        function currentDigestItems() {
            const selected = getSelectedTopics();
            const sourceList = selected.length ? selected : ['first-amendment', 'media-law', 'entertainment'];
            return latestStories.filter(item => sourceList.some(topic => item.category.toLowerCase().includes(topic.replace('-', ' '))));
        }

        function renderDigest() {
            const items = currentDigestItems();
            digestStories.innerHTML = '';

            if (!items.length) {
                digestStories.innerHTML = `
                    <div class="rounded-2xl border border-slate-200 bg-white p-5 text-slate-600">
                        No stories match the selected topics. Try refreshing or selecting more categories.
                    </div>
                `;
                statusEl.textContent = 'No digest items available for the selected topics.';
                return [];
            }

            items.forEach(item => {
                const article = document.createElement('article');
                article.className = 'rounded-2xl border border-slate-200 bg-white p-5';

                const title = document.createElement('h3');
                title.className = 'font-semibold text-lg';
                title.textContent = item.title;

                const meta = document.createElement('p');
                meta.className = 'mt-1 text-xs font-medium uppercase tracking-[0.15em] text-blue-700';
                meta.textContent = `${item.category} • ${item.source}`;

                const summary = document.createElement('p');
                summary.className = 'mt-3 text-sm leading-6 text-slate-600';
                summary.textContent = item.summary;

                article.appendChild(title);
                article.appendChild(meta);
                article.appendChild(summary);

                if (item.link) {
                    const link = document.createElement('a');
                    link.href = item.link;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.className = 'mt-4 inline-block text-sm font-semibold text-blue-800 hover:underline';
                    link.textContent = 'Read source';
                    article.appendChild(link);
                }

                digestStories.appendChild(article);
            });

            statusEl.textContent = `${items.length} ${items.length === 1 ? 'story' : 'stories'} in your digest • ${new Date().toLocaleDateString()}`;
            return items;
        }

        function buildDigestText() {
            const items = renderDigest();
            const lines = [
                'MEDIA LAW NEWS — DAILY DIGEST',
                new Date().toLocaleDateString(),
                ''
            ];

            items.forEach((item, i) => {
                lines.push(`${i + 1}. ${item.title}`);
                lines.push(`${item.category} • ${item.source}`);
                lines.push(item.summary || '');
                if (item.link) lines.push(item.link);
                lines.push('');
            });

            return lines.join('\n');
        }

        function refreshStories() {
            latestStories = readStoriesFromSite();
            renderDigest();
            if (!latestStories.length) {
                statusEl.textContent = 'The site feed is not ready yet. Try refreshing again in a moment.';
            }
        }

        function openDigestEmail() {
            const payload = buildDigestText();
            const subject = encodeURIComponent(`Media Law News Daily Digest — ${new Date().toLocaleDateString()}`);
            const body = encodeURIComponent(payload);
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        function downloadDigest() {
            const payload = buildDigestText();
            const blob = new Blob([payload], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = `media-law-digest-${new Date().toISOString().slice(0, 10)}.txt`;
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            URL.revokeObjectURL(url);
        }

        document.querySelectorAll('input[type="checkbox"]').forEach(input => {
            input.addEventListener('change', renderDigest);
        });

        document.getElementById('refresh-stories').addEventListener('click', refreshStories);
        document.getElementById('download-digest').addEventListener('click', downloadDigest);
        document.getElementById('email-digest').addEventListener('click', openDigestEmail);

        siteFrame.addEventListener('load', () => {
            refreshStories();
            const poll = setInterval(() => {
                const nextStories = readStoriesFromSite();
                if (nextStories.length) {
                    latestStories = nextStories;
                    renderDigest();
                    clearInterval(poll);
                }
            }, 500);
        });
    </script>
</body>
</html>
